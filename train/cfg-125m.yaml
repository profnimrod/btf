# Lab B reference configuration (~125M-class; Ch. 6 params-by-sight).
model:
  vocab: 32000
  d_model: 768
  n_layers: 12
  n_heads: 12
  n_kv_heads: 4
  d_head: 64
  d_ff: 3072            # SwiGLU
  rope_theta: 10000.0
  context: 2048
  quant: none            # switch to `ternary` for the Ch. 4 stretch goal
train:
  tokenizer: tok/domain-32k
  seq_len: 2048
  micro_batch: 16        # per-device sequences (GPU); tests override
  grad_accum: 4
  lr: 3.0e-4
  warmup_steps: 2000
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  seed: 1337
